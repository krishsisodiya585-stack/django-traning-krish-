{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LUXORA</title>

    <link rel="stylesheet"
          href="{% static 'mycss.css' %}">

</head>


<body>

    <!-- Animated background -->
    <div class="background">

        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>

        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>
        <span class="particle p7"></span>
        <span class="particle p8"></span>

    </div>


    <!-- Mouse glow -->
    <div id="cursorGlow"></div>


    <!-- HEADER -->

    <header class="luxury-header">

        <div class="brand">

            <div class="brand-symbol">
                L
            </div>

            <div class="brand-text">

                <h1>LUXORA</h1>

                <span>
                    PREMIUM DIGITAL GALLERY
                </span>

            </div>

        </div>


        <nav>

            <a href="{% url 'home' %}"
               class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                HOME
            </a>


            <a href="{% url 'about' %}"
               class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">
                ABOUT
            </a>


            <a href="{% url 'info' %}"
               class="{% if request.resolver_match.url_name == 'info' %}active{% endif %}">
                INFO
            </a>

        </nav>

    </header>



    <!-- MAIN CONTENT -->

    <main class="page">

        {% block content %}

        {% endblock %}

    </main>



    <!-- FOOTER -->

    <footer>

        <div class="footer-line"></div>

        <p>
            © @copyright Krish Sisodiya
        </p>

        <span>
            LUXORA • PREMIUM DIGITAL EXPERIENCE
        </span>

    </footer>


    <script>

        const glow =
            document.getElementById("cursorGlow");


        document.addEventListener(
            "mousemove",
            function(e) {

                glow.style.left =
                    e.clientX + "px";

                glow.style.top =
                    e.clientY + "px";

            }
        );


        document.querySelectorAll(".luxury-card")
        .forEach(card => {

            card.addEventListener(
                "mousemove",
                function(e) {

                    const rect =
                        card.getBoundingClientRect();

                    const x =
                        e.clientX - rect.left;

                    const y =
                        e.clientY - rect.top;

                    const centerX =
                        rect.width / 2;

                    const centerY =
                        rect.height / 2;

                    const rotateX =
                        (y - centerY) / 18;

                    const rotateY =
                        (centerX - x) / 18;

                    card.style.transform =
                        `perspective(1000px)
                         rotateX(${rotateX}deg)
                         rotateY(${rotateY}deg)
                         translateY(-12px)`;

                }
            );


            card.addEventListener(
                "mouseleave",
                function() {

                    card.style.transform =
                        "perspective(1000px) rotateX(0) rotateY(0)";

                }
            );

        });

    </script>

</body>

</html>
