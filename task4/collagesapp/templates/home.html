{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>College App - Home</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
        }

        .navbar {
            background: #222;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #00bcd4;
        }

        .content {
            background: white;
            margin-top: 25px;
            padding: 40px;
            min-height: 350px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .content h2 {
            font-size: 32px;
            color: #333;
        }

        .content p {
            font-size: 18px;
            line-height: 1.8;
            color: #555;
        }

        .colleges {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .college-box {
            padding: 25px 40px;
            background: #eeeeee;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>College App</h1>


    <!-- Navigation -->

    <div class="navbar">

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'sistec' %}">
            SISTec
        </a>

        <a href="{% url 'lnct' %}">
            LNCT
        </a>

        <a href="{% url 'oist' %}">
            OIST
        </a>

    </div>


    <!-- Home Content -->

    <div class="content">

        <h2>Welcome to College App</h2>

        <p>
            Welcome to our College Information Website.
            Here you can find information about different
            colleges such as SISTec, LNCT and OIST.
        </p>


        <div class="collages">

            <div class="collages-box">
                SISTec
            </div>

            <div class="collages-box">
                LNCT
            </div>

            <div class="collages-box">
                OIST
            </div>

        </div>

    </div>

</div>

</body>

</html>
